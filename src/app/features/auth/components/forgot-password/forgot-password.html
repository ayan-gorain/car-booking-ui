<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="card shadow-lg border-0 p-4" style="width: 420px;">

    <div class="text-center mb-4">
      <i class="bi bi-shield-lock fs-1 text-primary"></i>

      <h3 class="fw-bold mt-3">Forgot Password</h3>

      <p class="text-muted small">
        Enter your registered email address and we'll send you a password reset link.
      </p>
    </div>

    <form
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="mb-4">

        <label class="form-label fw-semibold">
          Email Address
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>

          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter your email">

        </div>

        <small
          class="text-danger mt-1 d-block"
          *ngIf="forgotPasswordForm.get('email')?.touched &&
                 forgotPasswordForm.get('email')?.hasError('required')">

          Email is required.

        </small>

        <small
          class="text-danger mt-1 d-block"
          *ngIf="forgotPasswordForm.get('email')?.touched &&
                 forgotPasswordForm.get('email')?.hasError('email')">

          Please enter a valid email.

        </small>

      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary w-100 py-2 fw-semibold">

        Send Reset Link

      </button>

    </form>

    <div class="text-center mt-4">

      <button
        type="button"
        class="btn btn-link text-decoration-none"
        (click)="backToLogin()">

        <i class="bi bi-arrow-left me-1"></i>
        Back to Login

      </button>

    </div>

  </div>

</div>
