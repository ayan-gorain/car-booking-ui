<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="card shadow-lg border-0 p-4" style="width: 420px;">

    <div class="text-center mb-4">
      <i class="bi bi-key fs-1 text-primary"></i>

      <h3 class="fw-bold mt-3">Reset Password</h3>

      <p class="text-muted small">
        Please enter your new password below.
      </p>
    </div>

    <!-- Alert if token is missing -->
    <div class="alert alert-warning text-center small mb-3" *ngIf="!token">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      Reset token is missing from the URL. Please verify your link.
    </div>

    <form
      [formGroup]="resetPasswordForm"
      (ngSubmit)="onSubmit()"
      *ngIf="token">

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label fw-semibold small">New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-secondary">
            <i class="bi bi-lock"></i>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Enter new password">
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="showPassword = !showPassword">
            <i
              class="bi"
              [class.bi-eye]="!showPassword"
              [class.bi-eye-slash]="showPassword">
            </i>
          </button>
        </div>

        <small
          class="text-danger small mt-1 d-block"
          *ngIf="resetPasswordForm.get('password')?.touched && resetPasswordForm.get('password')?.hasError('required')">
          Password is required.
        </small>

        <small
          class="text-danger small mt-1 d-block"
          *ngIf="resetPasswordForm.get('password')?.touched && resetPasswordForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters.
        </small>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label class="form-label fw-semibold small">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-secondary">
            <i class="bi bi-shield-check"></i>
          </span>
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="confirmPassword"
            placeholder="Confirm new password">
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="showConfirmPassword = !showConfirmPassword">
            <i
              class="bi"
              [class.bi-eye]="!showConfirmPassword"
              [class.bi-eye-slash]="showConfirmPassword">
            </i>
          </button>
        </div>

        <small
          class="text-danger small mt-1 d-block"
          *ngIf="resetPasswordForm.get('confirmPassword')?.touched && resetPasswordForm.get('confirmPassword')?.hasError('required')">
          Confirm Password is required.
        </small>

        <small
          class="text-danger small mt-1 d-block"
          *ngIf="resetPasswordForm.get('confirmPassword')?.touched &&
                 resetPasswordForm.value.password !== resetPasswordForm.value.confirmPassword">
          Passwords do not match.
        </small>
      </div>

      <!-- Messages -->
      <div class="alert alert-danger mb-3" *ngIf="errorMessage" style="white-space: pre-line;">
        {{ errorMessage }}
      </div>

      <div class="alert alert-success mb-3" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary w-100 py-2 fw-semibold"
        [disabled]="resetPasswordForm.invalid || successMessage || isLoading">

        <span
          *ngIf="isLoading"
          class="spinner-border spinner-border-sm me-2">
        </span>

        {{ isLoading ? 'Resetting...' : 'Reset Password' }}

      </button>

    </form>

    <div class="text-center mt-4">
      <button
        type="button"
        class="btn btn-link text-decoration-none"
        (click)="backToLogin()">
        <i class="bi bi-arrow-left me-1"></i>
        Back to Login
      </button>
    </div>

  </div>

</div>
