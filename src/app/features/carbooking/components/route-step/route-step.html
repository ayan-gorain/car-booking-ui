<!-- Header Banner (Country + Trip Type) -->
<div class="card bg-dark text-white rounded-4 border-0 p-4 mb-4 shadow-sm">
  <div class="row align-items-center g-3">
    <div class="col-md-6">
      <h5 class="fw-bold mb-1 text-white">
        <i class="bi bi-geo-alt-fill me-2 text-primary"></i>Step 1: Select Route
      </h5>
      <p class="text-secondary small mb-0">Select country, pickup and dropoff cities for your journey.</p>
    </div>

    <!-- Single Country Select & Trip Type -->
    <div class="col-md-6 d-flex flex-wrap justify-content-md-end gap-3 align-items-center">

      <!-- Country Dropdown -->
      <div class="d-flex align-items-center gap-2 bg-secondary bg-opacity-25 px-3 py-1 rounded-3">
        <i class="bi bi-globe text-primary"></i>
        <select class="form-select form-select-sm bg-transparent text-white border-0 fw-semibold cursor-pointer"
          style="width: 140px;"
          [(ngModel)]="state.selectedCountry"
          (ngModelChange)="onCountryChange()"
          id="country-select">
          @for (c of countries; track c.code) {
            <option class="text-dark" [value]="c.code">{{ c.flag }} {{ c.name }}</option>
          }
        </select>
      </div>

      <!-- Trip Type -->
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-sm px-3 py-2 fw-semibold"
          [class.btn-primary]="state.tripType === 'one-way'"
          [class.btn-outline-light]="state.tripType !== 'one-way'"
          (click)="setTripType('one-way')">
          <i class="bi bi-arrow-right me-1"></i>One Way
        </button>

        <button type="button" class="btn btn-sm px-3 py-2 fw-semibold"
          [class.btn-primary]="state.tripType === 'round-trip'"
          [class.btn-outline-light]="state.tripType !== 'round-trip'"
          (click)="setTripType('round-trip')">
          <i class="bi bi-arrow-left-right me-1"></i>Round Trip
        </button>
      </div>

    </div>
  </div>
</div>


<!-- ── Route Cards (From & To) ── -->
<div class="row g-3 align-items-center mb-4">

  <!-- FROM -->
  <div class="col-md-5 position-relative">
    <div class="card border rounded-4 shadow-sm p-3 bg-white" id="from-autocomplete-wrap">
      <label class="form-label text-uppercase text-secondary fw-bold small mb-1" style="font-size: 11px;">
        <i class="bi bi-geo-alt-fill text-primary me-1"></i>Pickup City
      </label>
      <div class="input-group">
        <span class="input-group-text bg-white border-0 p-0 me-2 text-primary fs-5">
          <i class="bi bi-search"></i>
        </span>
        <input
          type="text"
          class="form-control border-0 p-0 fw-bold fs-6 text-dark"
          id="from-city-input"
          [(ngModel)]="state.fromInput"
          (ngModelChange)="onFromInput()"
          (focus)="fromDropdownOpen = true"
          placeholder="Type pickup city..."
          autocomplete="off" />
      </div>

      <!-- Inline Suggestions Dropdown -->
      @if (fromDropdownOpen && fromSuggestions().length > 0) {
        <div class="list-group position-absolute start-0 end-0 top-100 mt-2 shadow-lg rounded-3 z-3 bg-white overflow-auto" style="max-height: 240px;">
          @for (city of fromSuggestions(); track city.id) {
            <button type="button"
              class="list-group-item list-group-item-action d-flex align-items-center gap-3 border-0 py-2 px-3"
              (mousedown)="selectFromCity(city)">
              <span class="fs-5">{{ city.flag }}</span>
              <div class="flex-grow-1 text-start">
                <div class="fw-bold small text-dark">{{ city.name }}</div>
                <div class="text-muted" style="font-size: 11px;">{{ city.state }}</div>
              </div>
              @if (state.selectedFromCity?.id === city.id) {
                <i class="bi bi-check-circle-fill text-primary"></i>
              }
            </button>
          }
        </div>
      }
    </div>
  </div>

  <!-- Swap Icon -->
  <div class="col-md-2 text-center">
    <button type="button" class="btn btn-primary rounded-circle shadow-sm p-0 d-inline-flex align-items-center justify-content-center"
      style="width: 44px; height: 44px;"
      (click)="swapCities()"
      [disabled]="!state.selectedFromCity && !state.selectedToCity"
      title="Swap pickup and dropoff">
      <i class="bi bi-arrow-left-right fs-5"></i>
    </button>
  </div>

  <!-- TO -->
  <div class="col-md-5 position-relative">
    <div class="card border rounded-4 shadow-sm p-3 bg-white" id="to-autocomplete-wrap">
      <label class="form-label text-uppercase text-secondary fw-bold small mb-1" style="font-size: 11px;">
        <i class="bi bi-geo-fill text-danger me-1"></i>Dropoff City
      </label>
      <div class="input-group">
        <span class="input-group-text bg-white border-0 p-0 me-2 text-danger fs-5">
          <i class="bi bi-search"></i>
        </span>
        <input
          type="text"
          class="form-control border-0 p-0 fw-bold fs-6 text-dark"
          id="to-city-input"
          [(ngModel)]="state.toInput"
          (ngModelChange)="onToInput()"
          (focus)="toDropdownOpen = true"
          placeholder="Type dropoff city..."
          autocomplete="off" />
      </div>

      <!-- Inline Suggestions Dropdown -->
      @if (toDropdownOpen && toSuggestions().length > 0) {
        <div class="list-group position-absolute start-0 end-0 top-100 mt-2 shadow-lg rounded-3 z-3 bg-white overflow-auto" style="max-height: 240px;">
          @for (city of toSuggestions(); track city.id) {
            <button type="button"
              class="list-group-item list-group-item-action d-flex align-items-center gap-3 border-0 py-2 px-3"
              (mousedown)="selectToCity(city)">
              <span class="fs-5">{{ city.flag }}</span>
              <div class="flex-grow-1 text-start">
                <div class="fw-bold small text-dark">{{ city.name }}</div>
                <div class="text-muted" style="font-size: 11px;">{{ city.state }}</div>
              </div>
              @if (state.selectedToCity?.id === city.id) {
                <i class="bi bi-check-circle-fill text-danger"></i>
              }
            </button>
          }
        </div>
      }
    </div>
  </div>

</div>

<!-- Route Map Visualizer with A-B Connectors -->
<app-route-map
  [fromCity]="state.selectedFromCity"
  [toCity]="state.selectedToCity"
  [country]="selectedCountryObj"
  [tripType]="state.tripType">
</app-route-map>

<!-- Action Button -->
<button type="button" class="btn btn-primary btn-lg w-100 rounded-3 py-3 fw-bold shadow-sm"
  [disabled]="!isValid()"
  (click)="onNext()">
  Proceed to Date & Time Schedule <i class="bi bi-arrow-right ms-2"></i>
</button>
