<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-3" style="height:56px;">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
      <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
        style="width:34px;height:34px;">
        <i class="bi bi-car-front-fill text-white fs-6"></i>
      </div>
      Car Booking
    </a>

    <!-- Right side -->
    <div class="ms-auto d-flex align-items-center gap-3">

      <!-- User pill button — always clickable -->
      <button
        type="button"
        class="nav-user-btn d-flex align-items-center gap-2"
        (click)="openProfileModal()">

        <span *ngIf="isProfileLoading" class="spinner-border spinner-border-sm text-light"></span>

        <ng-container *ngIf="!isProfileLoading">
          <div class="nav-avatar">
            {{ (userProfile?.firstName || 'U').charAt(0).toUpperCase() }}
          </div>
          <span class="text-white small fw-semibold">
            {{ userProfile?.firstName || 'User' }}
          </span>
          <span class="role-badge" *ngIf="userRole">
            {{ userRole }}
          </span>
        </ng-container>

      </button>

      <!-- Logout -->
      <button type="button" class="btn btn-outline-light btn-sm fw-semibold" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>

    </div>
  </div>
</nav>

<!-- Profile Modal (separate component) -->
<app-profile-modal
  *ngIf="isProfileModalOpen"
  (closeModal)="closeProfileModal()">
</app-profile-modal>
