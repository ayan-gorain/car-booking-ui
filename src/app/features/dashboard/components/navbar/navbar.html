<nav class="navbar navbar-expand-lg navbar-dark shadow px-4 py-3"
     style="background: linear-gradient(135deg, #1a56db 0%, #0ea5e9 100%);">
  <div class="container-fluid px-0">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 mb-0" href="#">
      <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
           style="width:40px;height:40px;">
        <i class="bi bi-car-front-fill text-white fs-5"></i>
      </div>
      Car Booking
    </a>

    <!-- Right side -->
    <div class="ms-auto d-flex align-items-center gap-3">

      <!-- User pill button — always clickable -->
      <button
        type="button"
        class="btn d-flex align-items-center gap-2 rounded-pill border border-white border-opacity-25 bg-white bg-opacity-10 px-2 py-1 text-white"
        style="transition: background 0.2s, transform 0.15s;"
        onmouseover="this.classList.add('bg-opacity-25'); this.style.transform='translateY(-1px)';"
        onmouseout="this.classList.remove('bg-opacity-25'); this.style.transform='translateY(0)';"
        (click)="openProfileModal()">

        <span *ngIf="isProfileLoading" class="spinner-border spinner-border-sm text-white mx-2"></span>

        <ng-container *ngIf="!isProfileLoading">
          <div class="rounded-circle bg-white d-flex align-items-center justify-content-center flex-shrink-0"
               style="width:30px;height:30px;">
            <span class="fw-bold small" style="color:#1a56db;">
              {{ (userProfile?.firstName || 'U').charAt(0).toUpperCase() }}
            </span>
          </div>
          <span class="small fw-semibold">
            Hi, {{ userProfile?.firstName || 'User' }}
          </span>
          <span class="badge rounded-pill bg-white bg-opacity-25 border border-white border-opacity-50 text-white fw-semibold px-2 py-1"
                style="font-size:10px; letter-spacing:0.04em;"
                *ngIf="userRole">
            {{ userRole }}
          </span>
        </ng-container>

      </button>

      <!-- Logout -->
      <button type="button" class="btn btn-outline-light btn-sm fw-semibold rounded-pill px-3" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>

    </div>
  </div>
</nav>

<!-- Profile Modal (separate component) -->
<app-profile-modal
  *ngIf="isProfileModalOpen"
  (closeModal)="closeProfileModal()">
</app-profile-modal>
