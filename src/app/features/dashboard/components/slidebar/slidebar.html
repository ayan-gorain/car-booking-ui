<div class="sidebar-nav bg-white border-end shadow-sm d-flex flex-column p-2"
  [style.width]="isExpanded ? '220px' : '66px'"
  style="height: calc(100vh - 56px); overflow: hidden;">

  <!-- Toggle button -->
  <div class="d-flex" [class.justify-content-end]="isExpanded" [class.justify-content-center]="!isExpanded"
    style="padding: 6px 4px 10px;">
    <button class="btn btn-light btn-sm rounded-3 border" (click)="toggleSlidebar()" title="Toggle sidebar">
      <i class="bi" [class.bi-layout-sidebar-inset-reverse]="isExpanded"
                    [class.bi-layout-sidebar-inset]="!isExpanded"></i>
    </button>
  </div>

  <hr class="my-1 border-secondary-subtle">

  <!-- Menu Items -->
  <ul class="nav flex-column gap-1 flex-grow-1 px-1 mt-1">
    <li *ngFor="let menu of menus">
      <button
        class="sidebar-menu-item btn w-100 d-flex align-items-center gap-2 py-2 px-2"
        [class.btn-primary]="activeMenu === menu.name"
        [class.text-primary]="activeMenu !== menu.name"
        [class.btn-light]="activeMenu !== menu.name"
        (click)="selectMenu(menu.name)"
        [title]="menu.name">
        <i class="bi {{ menu.icon }} fs-5 flex-shrink-0"></i>
        <span *ngIf="isExpanded" class="fw-semibold small text-truncate">{{ menu.name }}</span>
      </button>
    </li>
  </ul>

  <!-- Bottom brand -->
  <div *ngIf="isExpanded" class="mt-auto px-2 pb-2">
    <div class="bg-primary bg-opacity-10 rounded-3 p-2 text-center">
      <i class="bi bi-car-front-fill text-primary fs-5"></i>
      <p class="text-primary fw-semibold small mb-0 mt-1">Car Booking</p>
    </div>
  </div>

</div>
