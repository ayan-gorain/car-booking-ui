<div
  class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark vh-100"
  [style.width]="isExpanded ? '250px' : '80px'">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center">

    <h5 class="m-0" *ngIf="isExpanded">
      Dashboard
    </h5>

    <button
      class="btn btn-outline-light btn-sm ms-2"
      (click)="toggleSlidebar()">

      <i
        class="bi"
        [class.bi-list]="!isExpanded"
        [class.bi-x-lg]="isExpanded">
      </i>

    </button>

  </div>

  <hr>

  <ul class="nav nav-pills flex-column">

    <li class="mb-2">

      <button class="btn btn-dark w-100 text-start">

        <i class="bi bi-speedometer2"></i>

        <span class="ms-2" *ngIf="isExpanded">
          Dashboard
        </span>

      </button>

    </li>

    <li class="mb-2">

      <button class="btn btn-dark w-100 text-start">

        <i class="bi bi-people"></i>

        <span class="ms-2" *ngIf="isExpanded">
          Users
        </span>

      </button>

    </li>

    <li class="mb-2">

      <button class="btn btn-dark w-100 text-start">

        <i class="bi bi-box-seam"></i>

        <span class="ms-2" *ngIf="isExpanded">
          Products
        </span>

      </button>

    </li>

    <li class="mb-2">

      <button class="btn btn-dark w-100 text-start">

        <i class="bi bi-cart3"></i>

        <span class="ms-2" *ngIf="isExpanded">
          Orders
        </span>

      </button>

    </li>

    <li class="mb-2">

      <button class="btn btn-dark w-100 text-start">

        <i class="bi bi-bar-chart"></i>

        <span class="ms-2" *ngIf="isExpanded">
          Reports
        </span>

      </button>

    </li>

    <li class="mb-2">

      <button class="btn btn-dark w-100 text-start">

        <i class="bi bi-gear"></i>

        <span class="ms-2" *ngIf="isExpanded">
          Settings
        </span>

      </button>

    </li>

  </ul>

</div>
